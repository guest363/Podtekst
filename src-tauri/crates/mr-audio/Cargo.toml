[package]
name = "mr-audio"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
description = "Нативный захват и декодирование аудио без FFmpeg: Linux — PipeWire/PulseAudio, Windows/macOS — импорт файлов"
license = "MIT"
repository = "https://github.com/guest363/meeting-record"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hound.workspace = true
symphonia.workspace = true
# OGG/Opus (Telegram-голосовые): symphonia 0.5 знает контейнер, но не декодер.
opus-decoder.workspace = true

# Linux (libpulse) и Android (libaaudio) грузятся в рантайме через dlopen.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true

# Windows: WASAPI (микрофон + loopback системного звука). Крейт уже в графе
# через Tauri — новой тяжёлой зависимости не добавляем.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
default = []
