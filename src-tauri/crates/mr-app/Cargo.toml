[package]
name = "mr-app"
version = "0.7.3"
edition = "2021"
rust-version = "1.92"
description = "Подтекст (Podtekst) — нативное ядро (CLI + HTTP REST + трей; Tauri WebView за фичей)"
license = "MIT"
repository = "https://github.com/guest363/podtekst"

[[bin]]
name = "podtekst"
path = "src/main.rs"

# Мобильные сборки Tauri (Android/iOS) подключают ядро как cdylib/staticlib
# через JNI-обёртку `mobile_entry_point`; rlib — для бина и тестов.
[lib]
name = "mr_app_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono.workspace = true
clap.workspace = true
log = { workspace = true, features = ["release_max_level_off"] }
tiny_http.workspace = true
fs2.workspace = true
hound.workspace = true
mr-packs = { path = "../mr-packs" }
mr-ml = { path = "../mr-ml" }
mr-models = { path = "../mr-models" }
mr-audio = { path = "../mr-audio" }
mr-summarize = { path = "../mr-summarize" }
ureq.workspace = true
zip.workspace = true
sha2.workspace = true
uuid = { version = "1", features = ["v4"] }

# SIGINT/SIGTERM-финализация записи (unix).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# JNI-мост для системного меню «Поделиться» отчётом диагностики.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

# Нативный D-Bus (GNOME Shell Screencast) вместо внешнего интерпретатора python3-dbus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6"

# Доступная оперативная память для предохранителя длинных записей.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }



[build-dependencies]
tauri-build = { version = "2.1", optional = true , features = [] }

[features]
default = ["onnx"]
onnx = ["mr-ml/onnx"]
tauri-ui = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-global-shortcut",
  "dep:tauri-plugin-updater",
]

[dependencies.tauri]
version = "2.1"
optional = true
default-features = false
features = ["tray-icon", "wry"]

[dependencies.tauri-plugin-single-instance]
version = "2.1"
optional = true

[dependencies.tauri-plugin-autostart]
version = "2.1"
optional = true

[dependencies.tauri-plugin-global-shortcut]
version = "2.1"
optional = true

# Самообновление: скачивает подписанный пакет и перезапускает приложение.
[dependencies.tauri-plugin-updater]
version = "2"
optional = true
