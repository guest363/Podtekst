name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- Tauri v2 bundles (окно + трей; нужен системный WebView) ---
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: "--features tauri-ui --bundles appimage"
          - os: macos-14
            # pyke не поставляет x86_64 ONNX Runtime, поэтому macOS — arm64.
            args: "--features tauri-ui --target aarch64-apple-darwin --bundles dmg"
          - os: windows-latest
            args: "--features tauri-ui --bundles nsis"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebKit deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99" # закреплён rust-toolchain.toml; MSRV по lock-файлу — 1.92 (ort)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend (Svelte)
        shell: bash
        run: |
          corepack enable
          cd "$GITHUB_WORKSPACE/ui/web/frontend" && yarn install --immutable && yarn build
      - name: Rust unit tests (host)
        run: cargo test --workspace --locked
      # projectPath: нестандартная раскладка — tauri.conf.json лежит в
      # crates/mr-app, а не в <корень>/src-tauri.
      - name: Build Tauri bundle
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.4"
        with:
          projectPath: src-tauri/crates/mr-app
          args: ${{ matrix.args }}
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p bundle-pkg
          # Один пакет на платформу: AppImage / dmg / NSIS setup.exe.
          find "$GITHUB_WORKSPACE/src-tauri/target" -type f -path '*/bundle/*' \
            \( -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \) \
            -print0 | while IFS= read -r -d '' f; do
              cp "$f" "bundle-pkg/$(basename "$f")"
            done
          count=$(find bundle-pkg -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Ожидался ровно один пакет, найдено: $count"
            ls -la bundle-pkg/
            exit 1
          fi
          ls -la bundle-pkg/
      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundles-${{ matrix.os }}
          if-no-files-found: error
          # upload-artifact не наследует defaults.run.working-directory.
          path: src-tauri/bundle-pkg/*

  # Публикация — только после успеха сборок Tauri-бандлов.
  # Автообновление (updater/latest.json) отключено до генерации ключей подписи.
  publish:
    needs: [build-tauri]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          # GitHub Release кладёт ассеты плоско: в SHA256SUMS нужны basename.
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum \
            | sed 's#  artifacts/.*/#  #' > SHA256SUMS
          cat SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Meeting Recorder ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*
            SHA256SUMS
