[package]
name = "mr-ml"
version = "1.0.2"
edition = "2021"
rust-version = "1.92"
description = "Математика диаризации v2: мульти-прототипы, Венгерский алгоритм, Margin Gate (ONNX-рантайм за фичей onnx)"
license = "MIT"
repository = "https://github.com/guest363/podtekst"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
log.workspace = true

[features]
default = []
onnx = ["dep:ort"]
# Аппаратные Execution Providers (опционально; при недоступности — CPU-fallback):
# ort-cuda (Linux/Windows), ort-directml (Windows), ort-coreml (macOS), ort-nnapi (Android).
ort-cuda = ["onnx", "ort/cuda", "ort/copy-dylibs"]
ort-directml = ["onnx", "ort/directml", "ort/copy-dylibs"]
ort-coreml = ["onnx", "ort/coreml"]
ort-nnapi = ["onnx", "ort/nnapi"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_System_LibraryLoader"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true

[dependencies.ort]
version = "=2.0.0-rc.15"
optional = true
default-features = false
features = ["std", "download-binaries", "tls-rustls"]
