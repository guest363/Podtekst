name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- Tauri v2 bundles (окно + трей; нужен системный WebView) ---
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: "--features tauri-ui --bundles appimage"
          - os: macos-15
            # pyke не поставляет x86_64 ONNX Runtime, поэтому macOS — arm64.
            args: "--features tauri-ui --target aarch64-apple-darwin --bundles dmg"
          - os: windows-latest
            args: "--features tauri-ui --bundles nsis"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux WebKit deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99" # закреплён rust-toolchain.toml; MSRV по lock-файлу — 1.92 (ort)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend (Svelte)
        shell: bash
        run: |
          corepack enable
          cd "$GITHUB_WORKSPACE/ui/web/frontend" && yarn install --immutable && yarn build
      # Ключ подписи апдейтера — секрет репозитория. Без него пакет не подписать:
      # отключаем updater-артефакты, чтобы релиз собрался как раньше (без самообновления).
      - name: Updater signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY=$KEY"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Апдейтер: пакеты будут подписаны"
          else
            node -e "const fs=require('fs');const f='crates/mr-app/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2));"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY не задан — релиз без автообновления"
          fi
      - name: Rust unit tests (host)
        run: cargo test --workspace --locked
      # Подпись и нотаризация включаются сами, когда в репозитории заданы
      # секреты Apple Developer. Без них сборка остаётся неподписанной:
      # macOS покажет предупреждение Gatekeeper (см. README).
      - name: Configure macOS signing (optional)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "macOS: подпись и нотаризация включены"
          else
            echo "macOS: секреты Apple не заданы, сборка без подписи"
          fi
      # projectPath: нестандартная раскладка — tauri.conf.json лежит в
      # crates/mr-app, а не в <корень>/src-tauri.
      - name: Build Tauri bundle
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.4"
        with:
          projectPath: src-tauri/crates/mr-app
          args: ${{ matrix.args }}
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p bundle-pkg
          # Пакет для платформы + артефакты апдейтера: .app.tar.gz и подписи .sig.
          find "$GITHUB_WORKSPACE/src-tauri/target" -type f -path '*/bundle/*' \
            \( -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -print0 | while IFS= read -r -d '' f; do
              cp "$f" "bundle-pkg/$(basename "$f")"
            done
          count=$(find bundle-pkg -maxdepth 1 -type f ! -name '*.sig' | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "Не найден ни один установочный пакет"
            ls -la bundle-pkg/
            exit 1
          fi
          ls -la bundle-pkg/
      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundles-${{ matrix.os }}
          if-no-files-found: error
          # upload-artifact не наследует defaults.run.working-directory.
          path: src-tauri/bundle-pkg/*

  # --- Android APK (aarch64) ---
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          targets: aarch64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Android NDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            echo "Устанавливаю NDK 27..."
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"
            export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Используется NDK: $NDK_HOME"
      - name: Install tauri-cli
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
            cargo binstall -y --version "^2.12" tauri-cli || cargo install tauri-cli --version ^2.12 --locked
          fi
      - name: Build frontend (Svelte)
        shell: bash
        run: |
          corepack enable
          cd "$GITHUB_WORKSPACE/ui/web/frontend" && yarn install --immutable && yarn build
      - name: Build Android APK
        shell: bash
        run: |
          if [ "$CI" = "1" ]; then
            export CI=true
          fi
          touch src-tauri/crates/mr-app/build.rs
          cargo tauri android build \
            --config src-tauri/crates/mr-app/tauri.conf.json \
            --features tauri-ui \
            --apk --target aarch64
      - name: Collect Android APK
        shell: bash
        run: |
          mkdir -p bundle-pkg
          apk="$(find src-tauri/crates/mr-app/gen/android/app/build/outputs -name '*.apk' | head -n 1)"
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "Ошибка: APK не найден в outputs"
            find src-tauri/crates/mr-app/gen/android -name '*.apk' || true
            exit 1
          fi
          cp "$apk" bundle-pkg/meeting-recorder-android-arm64.apk
          ls -la bundle-pkg/
      - name: Upload Android APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundles-android
          if-no-files-found: error
          path: bundle-pkg/*

  # Публикация — только после успеха сборок Tauri-бандлов и Android APK.
  # Приложение проверяет обновления по последнему GitHub Release, поэтому
  # тег обязан совпадать с версией в Cargo.toml.
  publish:
    needs: [build-tauri, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag matches app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/crates/mr-app/Cargo.toml | head -n1)"
          if [ "$tag" != "$ver" ]; then
            echo "Тег v$tag не совпадает с версией приложения $ver"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          # GitHub Release кладёт ассеты плоско: в SHA256SUMS нужны basename.
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum \
            | sed 's#  artifacts/.*/#  #' > SHA256SUMS
          cat SHA256SUMS
      # Манифест штатного апдейтера Tauri: приложение читает его из
      # releases/latest/download/latest.json и сверяет подпись пакета.
      - name: Updater manifest
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import json, pathlib, sys

          tag, root = sys.argv[1], pathlib.Path("artifacts")
          kinds = {
              ".AppImage": "linux-x86_64",
              ".app.tar.gz": "darwin-aarch64",
              "-setup.exe": "windows-x86_64",
          }
          platforms = {}
          for sig in root.rglob("*.sig"):
              name = sig.name[:-4]
              key = next((v for k, v in kinds.items() if name.endswith(k)), None)
              if key:
                  platforms[key] = {
                      "url": f"https://github.com/guest363/meeting-record/releases/download/{tag}/{name}",
                      "signature": sig.read_text().strip(),
                  }
          if platforms:
              out = root / "updater"
              out.mkdir(exist_ok=True)
              (out / "latest.json").write_text(
                  json.dumps({"version": tag.lstrip("v"), "platforms": platforms},
                             ensure_ascii=False, indent=2))
              print("latest.json:", ", ".join(platforms))
          else:
              print("Подписей нет — latest.json не создаём")
          PY
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Meeting Recorder ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*
            SHA256SUMS
