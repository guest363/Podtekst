name: Feature request
description: Предложить улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решает
      placeholder: Опишите проблему или сценарий.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я проверил существующие issues и обсуждения
          required: true
