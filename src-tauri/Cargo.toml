[workspace]
members = [
  "crates/mr-audio",
  "crates/mr-ml",
  "crates/mr-packs",
  "crates/mr-models",
  "crates/mr-summarize",
  "crates/mr-metrics",
  "crates/mr-app",
  "crates/mr-eval",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
tiny_http = "0.12"
fs2 = "0.4"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "adpcm", "isomp4", "ogg", "vorbis", "aac", "flac"] }
opus-decoder = "0.1"
zip = { version = "9.1", default-features = false, features = ["deflate"] }
tar = "0.4"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
sha2 = "0.11"
regex = "1.13"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
libc = "0.2"
log = { version = "0.4", features = ["std", "kv"] }

# Для крейтов workspace оставляем line-tables-only (имена файлов и номера строк в
# backtrace сохраняются, но PDB на Windows кратно меньше и быстрее линкуется);
# сторонним крейтам отладочная информация в dev/test не нужна (наследуется test).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Меньший релизный бинарник: тонкий LTO + вырезание символов отладки
# без codegen-units = 1, чтобы LLVM распараллеливал кодогенерацию и ThinLTO.
[profile.release]
lto = "thin"
strip = "symbols"

# Быстрая локальная оптимизированная сборка без долгой фазы ThinLTO;
# продовый [profile.release] с lto = "thin" при этом остаётся без изменений.
[profile.release-fast]
inherits = "release"
lto = false

# Dev-сборка: оптимизации release, но с debug_assertions и без strip.
# release_max_level_off в `log` выключает макросы только при debug_assertions=false,
# поэтому в этом профиле dev-логи компилируются, а в обычном release — нет.
# LTO выключен намеренно: иначе dev-пересборка тратит лишнюю минуту на ThinLTO.
[profile.dev-opt]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16
debug = 1
strip = "none"

[profile.dev-opt.package."*"]
debug = false
