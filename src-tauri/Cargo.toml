[workspace]
members = [
  "crates/mr-audio",
  "crates/mr-ml",
  "crates/mr-packs",
  "crates/mr-models",
  "crates/mr-summarize",
  "crates/mr-app",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
tiny_http = "0.12"
fs2 = "0.4"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "isomp4", "ogg", "vorbis", "aac", "flac"] }
opus-decoder = "0.1"
zip = { version = "9.1", default-features = false, features = ["deflate"] }
sha2 = "0.11"
regex = "1.13"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
libc = "0.2"
log = { version = "0.4", features = ["std", "kv"] }

# Меньший релизный бинарник: тонкий LTO + вырезание символов отладки.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Dev-сборка: оптимизации release, но с debug_assertions и без strip.
# release_max_level_off в `log` выключает макросы только при debug_assertions=false,
# поэтому в этом профиле dev-логи компилируются, а в обычном release — нет.
[profile.dev-opt]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = "thin"
codegen-units = 16
debug = 1
strip = "none"
