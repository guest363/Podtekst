<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Подтекст - соцпревью</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      background: #f7f7f4;
      color: #14213a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .canvas {
      display: grid;
      grid-template-columns: 440px minmax(0, 1fr);
      gap: 48px;
      align-items: center;
      width: 1200px;
      height: 630px;
      padding: 52px 56px;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 56px; }
    .brand img { width: 42px; height: 42px; border-radius: 10px; }
    .brand span { font-size: 23px; font-weight: 720; letter-spacing: -0.035em; }
    .eyebrow {
      margin: 0 0 16px;
      color: #2456c6;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    h1 { margin: 0; max-width: 440px; font-size: 49px; line-height: 1.06; letter-spacing: -0.052em; }
    h1 span { color: #2456c6; }
    .description { margin: 22px 0 0; max-width: 400px; color: #536176; font-size: 18px; line-height: 1.5; }
    .facts { margin: 32px 0 0; color: #34445b; font-size: 13px; line-height: 1.7; }
    .visual { min-width: 0; margin: 0; }
    .visual img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #d9dee7;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 24px 54px rgba(20, 33, 58, 0.13);
    }
    .caption { margin: 16px 0 0; color: #6c7788; font-size: 12px; text-align: right; }
  </style>
</head>
<body>
  <main class="canvas">
    <section>
      <div class="brand"><img src="../site/assets/icon.png" alt=""><span>Подтекст</span></div>
      <p class="eyebrow">Локально на вашем компьютере</p>
      <h1>Расшифровка аудио в текст <span>без облака</span></h1>
      <p class="description">Запись встреч, разделение спикеров и готовый протокол. Бесплатно, без подписки и телеметрии.</p>
      <p class="facts">Windows · macOS · Linux<br>GigaAM-v3 + Whisper · открытый код MIT</p>
    </section>
    <figure class="visual">
      <img src="../site/assets/screenshots/transcript.webp" alt="">
      <figcaption class="caption">Настоящий интерфейс приложения · демонстрационные данные</figcaption>
    </figure>
  </main>
</body>
</html>
