name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Собрать и проверить без публикации"
        type: boolean
        default: true
      full_matrix:
        description: "Полная живая матрица (10/30/60/120, 4/8 cores, EN/injection/legal/psychology)"
        type: boolean
        default: false
      matrix_runner:
        description: "Linux x86_64 runner для full_matrix; для tier 8 нужно >=8 logical cores"
        type: string
        default: "ubuntu-24.04"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # Тег и версии проверяются до сборки: ключ апдейтера обязателен.
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/crates/mr-app/Cargo.toml | head -n1)"
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Require updater signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Секрет TAURI_SIGNING_PRIVATE_KEY не задан: релиз без подписанных обновлений не выпускаем"
            exit 1
          fi
      - name: Check versions and release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ALLOW_LEGACY_NOTES: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          extra=()
          if [ "$ALLOW_LEGACY_NOTES" = "true" ]; then
            extra+=(--allow-legacy-notes)
          fi
          python3 .github/scripts/updater_manifest.py --root . --tag "$TAG" --check-only "${extra[@]}"

  # --- Tauri v2 bundles (окно + трей; нужен системный WebView) ---
  build-tauri:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target_key: linux-x86_64
            args: "--features tauri-ui --bundles appimage --config tauri.summary.conf.json"
          - os: macos-26
            # pyke не поставляет x86_64 ONNX Runtime, поэтому macOS — arm64.
            # app нужен для updater-архива .app.tar.gz: с одним dmg его не создают.
            target_key: macos-arm64
            args: "--features tauri-ui --target aarch64-apple-darwin --bundles app,dmg --config tauri.summary.conf.json"
          - os: windows-latest
            target_key: windows-x86_64
            args: "--features tauri-ui --bundles nsis --config tauri.summary.conf.json"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux WebKit deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99" # закреплён rust-toolchain.toml; MSRV по lock-файлу — 1.92 (ort)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build frontend (Svelte)
        shell: bash
        run: |
          corepack enable
          cd "$GITHUB_WORKSPACE/ui/web/frontend" && yarn install --immutable && yarn build
      - name: Fetch and prune llama.cpp runtime
        shell: bash
        run: ../.github/scripts/fetch_summary_runtime.sh --target ${{ matrix.target_key }}
      - name: Rust unit tests (host)
        run: cargo test --workspace --locked
      # projectPath: нестандартная раскладка — tauri.conf.json лежит в
      # crates/mr-app, а не в <корень>/src-tauri.
      - name: Build Tauri bundle
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.4"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri/crates/mr-app
          args: ${{ matrix.args }}
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p bundle-pkg
          # Пакет для платформы + артефакты апдейтера: .app.tar.gz и подписи .sig.
          find "$GITHUB_WORKSPACE/src-tauri/target" -type f -path '*/bundle/*' \
            \( -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -print0 | while IFS= read -r -d '' f; do
              cp "$f" "bundle-pkg/$(basename "$f")"
            done
          count=$(find bundle-pkg -maxdepth 1 -type f ! -name '*.sig' | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "Не найден ни один установочный пакет"
            ls -la bundle-pkg/
            exit 1
          fi
          ls -la bundle-pkg/
      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundles-${{ matrix.os }}
          if-no-files-found: error
          # upload-artifact не наследует defaults.run.working-directory.
          path: src-tauri/bundle-pkg/*

  # --- Android APK (aarch64) ---
  build-android:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          targets: aarch64-linux-android
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Decode Android release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            path="$RUNNER_TEMP/podtekst-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$path"
            {
              echo "ANDROID_KEYSTORE_PATH=$path"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Android: release keystore подключён"
          else
            echo "::warning::Android: release keystore не задан, release APK будет подписан debug-ключом"
          fi
      - name: Setup Android NDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            echo "Устанавливаю NDK 27..."
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"
            export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Используется NDK: $NDK_HOME"
      - name: Install tauri-cli
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
            cargo binstall -y --version "^2.12" tauri-cli || cargo install tauri-cli --version ^2.12 --locked
          fi
      - name: Build frontend (Svelte)
        shell: bash
        run: |
          corepack enable
          cd "$GITHUB_WORKSPACE/ui/web/frontend" && yarn install --immutable && yarn build
      - name: Build Android APK
        shell: bash
        run: |
          if [ "$CI" = "1" ]; then
            export CI=true
          fi
          touch src-tauri/crates/mr-app/build.rs
          cargo tauri android build \
            --config src-tauri/crates/mr-app/tauri.conf.json \
            --features tauri-ui \
            --apk --target aarch64
      - name: Collect Android APK
        shell: bash
        run: |
          mkdir -p bundle-pkg
          apk="$(find src-tauri/crates/mr-app/gen/android/app/build/outputs -name '*-release.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            apk="$(find src-tauri/crates/mr-app/gen/android/app/build/outputs -name '*.apk' | head -n 1)"
          fi
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "Ошибка: APK не найден в outputs"
            find src-tauri/crates/mr-app/gen/android -name '*.apk' || true
            exit 1
          fi
          cp "$apk" bundle-pkg/Podtekst-android-arm64.apk
          ls -la bundle-pkg/
      - name: Upload Android APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundles-android
          if-no-files-found: error
          path: bundle-pkg/*

  # Живой прогон на релизном теге: pinned runtime и Qwen3-4B должны отработать
  # вместе. Этот workflow запускается только тегом или workflow_dispatch; на PR
  # тяжёлая модель не скачивается. Без манифеста и живой генерации релиз
  # не публикуется.
  real-summary:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MC_RUNTIME: ${{ github.workspace }}/src-tauri/binaries/runtime/x86_64-unknown-linux-gnu
      MR_TEST_FIXTURES: ${{ github.workspace }}/src-tauri/crates/mr-summarize/tests/fixtures
      MR_TEST_TRANSCRIPT: ${{ github.workspace }}/src-tauri/crates/mr-summarize/tests/fixtures/scrum-ru.json
      SUMMARY_REQUIRE_REAL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch pinned llama.cpp runtime
        shell: bash
        run: |
          .github/scripts/fetch_summary_runtime.sh --target linux-x86_64
          test -x "$MC_RUNTIME/llama-server"
      - name: Fetch Qwen3-4B model (SHA-256 from manifest)
        shell: bash
        run: .github/scripts/fetch_summary_model.sh --dest "$RUNNER_TEMP/summary-model"
      - name: Real model smoke (SUMMARY_REQUIRE_REAL=1)
        shell: bash
        env:
          MR_SUMMARY_RUNTIME: ${{ github.workspace }}/src-tauri/binaries/runtime/x86_64-unknown-linux-gnu
        run: |
          set -o pipefail
          mkdir -p verification
          cargo test -p mr-app --test summary_real --locked \
            --manifest-path src-tauri/Cargo.toml -- --nocapture 2>&1 \
            | tee verification/summary-real.log
          grep -q "summary_real: total=" verification/summary-real.log || {
            echo "::error::summary_real не дошёл до живой генерации"; exit 1; }
          if grep -q "summary_real: skip" verification/summary-real.log; then
            echo "::error::summary_real пропущен, а не выполнен"; exit 1
          fi
      - name: Build headless binary for the matrix
        run: cargo build -p mr-app --locked --manifest-path src-tauri/Cargo.toml
      - name: 10-minute synthetic real case
        shell: bash
        env:
          MR_SUMMARY_RUNTIME: ${{ github.workspace }}/src-tauri/binaries/runtime/x86_64-unknown-linux-gnu
        run: |
          python3 .github/scripts/summary_real_matrix.py \
            --exe src-tauri/target/debug/podtekst \
            --runtime "$MR_SUMMARY_RUNTIME" \
            --model "$MR_SUMMARY_MODEL" \
            --fixtures "$MR_TEST_FIXTURES" \
            --out verification/summary-real-matrix.json \
            --budget-profile ci-loaded --enforce-budget
      - name: Write real-model manifest
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          MR_SUMMARY_RUNTIME: ${{ github.workspace }}/src-tauri/binaries/runtime/x86_64-unknown-linux-gnu
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          def sha256(path):
              digest = hashlib.sha256()
              with Path(path).open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          def stop(message):
              print(f"::error::{message}")
              sys.exit(1)

          root = Path(".")
          log = Path("verification/summary-real.log").read_text(encoding="utf-8", errors="replace")
          if "summary_real: total=" not in log or "summary_real: skip" in log:
              stop("нет доказательства живого summary_real")
          matrix_path = Path("verification/summary-real-matrix.json")
          if not matrix_path.is_file():
              stop("нет verification/summary-real-matrix.json")
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          ten = [
              case for case in matrix.get("cases", [])
              if case.get("duration_min") == 10 and case.get("status") == "pass"
          ]
          if not ten:
              stop("в матрице нет пройденного 10-минутного кейса")
          if not any(case.get("budget_met") is True for case in ten):
              stop("10-минутный кейс не подтвердил бюджет")
          if matrix.get("budget_enforced") is not True:
              stop("матрица запущена без --enforce-budget")

          runtime = Path(os.environ["MR_SUMMARY_RUNTIME"])
          launcher = runtime / "llama-server"
          if not launcher.is_file():
              stop(f"нет runtime launcher: {launcher}")

          models = json.loads(
              (root / "src-tauri/crates/mr-models/models-manifest.json").read_text(encoding="utf-8")
          )
          model_entry = next(
              m for m in models["models"] if m["id"] == "sum-qwen3-4b-instruct-2507-q4km"
          )
          model_file = Path(os.environ["MR_SUMMARY_MODEL"])
          model_sha = sha256(model_file)
          pinned_sha = model_entry["files"][0]["sha256"]
          if model_sha != pinned_sha:
              stop(f"model sha {model_sha} != pinned {pinned_sha}")

          runtime_manifest = json.loads(
              (root / "src-tauri/crates/mr-app/summary-runtime-manifest.json").read_text(encoding="utf-8")
          )
          target = runtime_manifest["targets"]["linux-x86_64"]
          fixtures = sorted(
              {case["fixture"] for case in matrix.get("cases", [])}
              | {"scrum-ru.json"}
          )
          manifest = {
              "spec": "SPEC §17 H06/M18",
              "generated_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "tag": os.environ.get("TAG"),
              "commit": os.environ.get("GITHUB_SHA"),
              "reviewer": os.environ.get("GITHUB_ACTOR"),
              "second_rater": None,
              "runtime": {
                  "version": runtime_manifest["version"],
                  "build": runtime_manifest["build"],
                  "commit": runtime_manifest["commit"],
                  "archive_sha256": target["sha256"],
                  "launcher_sha256": sha256(launcher),
              },
              "model": {
                  "id": model_entry["id"],
                  "filename": model_file.name,
                  "sha256": model_sha,
                  "size_bytes": model_file.stat().st_size,
              },
              "fixture_ids": [Path(name).stem for name in fixtures],
              "real_test": {
                  "test": "summary_real",
                  "fixture": "scrum-ru",
                  "status": "pass",
                  "log": "verification/summary-real.log",
              },
              "budget": {
                  "profile": matrix.get("budget_profile"),
                  "profile_note": matrix.get("budget_profile_note"),
                  "enforced": matrix.get("budget_enforced"),
                  "measurements": [
                      {
                          "id": case.get("id"),
                          "duration_min": case.get("duration_min"),
                          "logical_cores": case.get("logical_cores"),
                          "source_chars": case.get("source_chars"),
                          "runs_per_case": case.get("runs_per_case"),
                          "p50_sec": case.get("p50_sec"),
                          "p95_sec": case.get("p95_sec"),
                          "budget_sec": case.get("budget_sec"),
                          "budget_met": case.get("budget_met"),
                          "peak_rss_mb": case.get("peak_rss_mb"),
                          "cancel_ms": case.get("cancel_ms"),
                          "status": case.get("status"),
                      }
                      for case in matrix.get("cases", [])
                  ],
              },
              "not_run": matrix.get("not_run", []),
              "matrix": matrix,
          }
          Path("verification/summary-real-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print("→ verification/summary-real-manifest.json")
          PY
      - name: Upload real-model evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: summary-real-evidence
          if-no-files-found: warn
          path: |
            verification/summary-real-manifest.json
            verification/summary-real-matrix.json
            verification/summary-real.log

  # Полная матрица — только по явному workflow_dispatch, не на каждом
  # релизе. Tier 8 требует >=8 logical cores; иначе он честно попадает в
  # not_run отчёта. 30/60/120 в профиле ci-loaded бюджета не имеют:
  # измеряются и записываются, но не гейтятся.
  full-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
    runs-on: ${{ inputs.matrix_runner || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      MC_RUNTIME: ${{ github.workspace }}/src-tauri/binaries/runtime/x86_64-unknown-linux-gnu
      MR_TEST_FIXTURES: ${{ github.workspace }}/src-tauri/crates/mr-summarize/tests/fixtures
      SUMMARY_REQUIRE_REAL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch pinned llama.cpp runtime
        shell: bash
        run: |
          .github/scripts/fetch_summary_runtime.sh --target linux-x86_64
          test -x "$MC_RUNTIME/llama-server"
      - name: Fetch Qwen3-4B model (SHA-256 from manifest)
        shell: bash
        run: .github/scripts/fetch_summary_model.sh --dest "$RUNNER_TEMP/summary-model"
      - name: Build headless binary for the matrix
        run: cargo build -p mr-app --locked --manifest-path src-tauri/Cargo.toml
      - name: Full real matrix (10/30/60/120, 4/8 cores, EN/injection/legal/psychology)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification
          python3 .github/scripts/summary_real_matrix.py \
            --exe src-tauri/target/debug/podtekst \
            --runtime "$MC_RUNTIME" \
            --model "$MR_SUMMARY_MODEL" \
            --fixtures "$MR_TEST_FIXTURES" \
            --out verification/summary-real-matrix-full.json \
            --full --cores 4,8 --runs 1/3 \
            --budget-profile ci-loaded --enforce-budget 2>&1 \
            | tee verification/summary-real-matrix-full.log
      - name: Upload full-matrix evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: summary-real-matrix-full
          if-no-files-found: warn
          path: |
            verification/summary-real-matrix-full.json
            verification/summary-real-matrix-full.log

  smoke-linux:
    needs: [meta, build-tauri]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/download-artifact@v8
        with:
          name: tauri-bundles-ubuntu-24.04
          path: pkg
      - name: Check bundled runtime in AppImage
        shell: bash
        run: |
          appimage="$(find pkg -name '*.AppImage' -print -quit)"
          if [ -z "$appimage" ]; then
            echo "::error::AppImage не найден"
            exit 1
          fi
          chmod +x "$appimage"
          appimage="$(realpath "$appimage")"
          work="$RUNNER_TEMP/appimage-check"
          mkdir -p "$work"
          cd "$work"
          "$appimage" --appimage-extract >/dev/null
          runtime="squashfs-root/usr/lib/Podtekst/runtime/x86_64-unknown-linux-gnu"
          test -x "$runtime/llama-server" || {
            echo "::error::в AppImage нет runtime/$runtime"; exit 1; }
          if [ -n "$(find squashfs-root -name '*.gguf' -print -quit)" ]; then
            echo "::error::в AppImage попали веса модели"; exit 1
          fi
          LD_LIBRARY_PATH="$runtime" "$runtime/llama-server" --version
          for file in "$runtime"/*.so "$runtime/llama-server"; do
            case "$(ldd "$file" 2>&1)" in
              *"not found"*) echo "::error::не найдены зависимости $file"; exit 1 ;;
            esac
          done
          du -sb "$runtime"
          # Бюджет 60 МБ относится к установленному pruned-runtime.
          # Полный AppImage фиксируем как метрику, а не как бюджет.
          runtime_bytes=$(find "$runtime" -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          appimage_bytes=$(stat -c %s "$appimage")
          budget=$((60 * 1024 * 1024))
          echo "bundle: runtime=$runtime_bytes bytes, AppImage=$appimage_bytes bytes, budget=$budget bytes"
          if [ "$runtime_bytes" -gt "$budget" ]; then
            echo "::error::runtime $runtime_bytes байт больше бюджета $budget"
            exit 1
          fi
          python3 - "$runtime_bytes" "$appimage_bytes" "$budget" > "$GITHUB_WORKSPACE/bundle-size.json" <<'PY'
          import json
          import sys

          runtime, appimage, budget = map(int, sys.argv[1:4])
          print(json.dumps({
              "metric": "installed_runtime_bytes",
              "runtime_bytes": runtime,
              "appimage_bytes": appimage,
              "budget_bytes": budget,
              "within_budget": runtime <= budget,
          }, ensure_ascii=False))
          PY
      - name: Upload Linux bundle size
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size-linux
          if-no-files-found: error
          path: bundle-size.json
      - name: Smoke AppImage over HTTP
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          appimage="$(find pkg -name '*.AppImage' -print -quit)"
          if [ -z "$appimage" ]; then
            echo "::error::AppImage не найден"
            exit 1
          fi
          chmod +x "$appimage"
          python3 .github/scripts/smoke_http.py \
            --exe "$appimage" \
            --expected-version "$VERSION" \
            --expected-os linux \
            --expected-arch x86_64 \
            --static-dir ui/web/static \
            --expect-summary-runtime bundled

  smoke-macos:
    needs: [meta, build-tauri]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tauri-bundles-macos-26
          path: pkg
      - name: Smoke .app from dmg
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          dmg="$(find pkg -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "::error::dmg не найден"
            exit 1
          fi
          mount="$RUNNER_TEMP/podtekst-dmg"
          appdir="$RUNNER_TEMP/podtekst-app"
          mkdir -p "$mount" "$appdir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            hdiutil detach "$mount"
            echo "::error::.app не найден в dmg"
            exit 1
          fi
          ditto "$app" "$appdir/Podtekst.app"
          hdiutil detach "$mount"
          # Gatekeeper не проверяем: релиз без Apple Developer ID.
          xattr -dr com.apple.quarantine "$appdir/Podtekst.app" || true
          exe="$appdir/Podtekst.app/Contents/MacOS/podtekst"
          if [ ! -x "$exe" ]; then
            echo "::error::нет исполняемого файла $exe"
            exit 1
          fi
          runtime="$appdir/Podtekst.app/Contents/Resources/runtime/aarch64-apple-darwin"
          test -x "$runtime/llama-server" || {
            echo "::error::в .app нет runtime/llama-server"; exit 1; }
          if [ -n "$(find "$appdir/Podtekst.app" -name '*.gguf' -print -quit)" ]; then
            echo "::error::в .app попали веса модели"; exit 1
          fi
          DYLD_LIBRARY_PATH="$runtime" "$runtime/llama-server" --version
          for file in "$runtime"/*.dylib "$runtime/llama-server"; do
            case "$(otool -L "$file" 2>&1)" in
              *"not found"*) echo "::error::otool не нашёл зависимости $file"; exit 1 ;;
            esac
          done
          # Политика проекта — без Developer ID; фиксируем статус в логе.
          codesign --verify --deep --strict "$appdir/Podtekst.app" \
            && echo "codesign: valid" || echo "codesign: unsigned/ad-hoc"
          du -sk "$runtime"
          python3 .github/scripts/smoke_http.py \
            --exe "$exe" \
            --expected-version "$VERSION" \
            --expected-os macos \
            --expected-arch arm64 \
            --static-dir ui/web/static \
            --expect-summary-runtime bundled

  smoke-windows:
    needs: [meta, build-tauri]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tauri-bundles-windows-latest
          path: pkg
      - name: Install and smoke NSIS
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $installer = Get-ChildItem pkg -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Error "NSIS installer не найден"
            exit 1
          }
          $installDir = Join-Path $env:RUNNER_TEMP "podtekst-install"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait
          # Приложение выбираем по известному имени. В установке лежит и
          # runtime\llama-server.exe: выбор «первого exe» проверял бы runtime.
          $exe = Get-ChildItem -Path $installDir -Filter '*.exe' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ieq 'podtekst.exe' -and $_.FullName -notmatch '\\runtime\\' } |
            Select-Object -First 1
          if (-not $exe) {
            $fallback = Join-Path $env:LOCALAPPDATA 'Podtekst'
            $exe = Get-ChildItem -Path $fallback -Filter '*.exe' -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ieq 'podtekst.exe' -and $_.FullName -notmatch '\\runtime\\' } |
              Select-Object -First 1
          }
          if (-not $exe) {
            Write-Error "podtekst.exe приложения не найден после установки"
            exit 1
          }
          if ($exe.BaseName -notmatch '^podtekst$' -or $exe.FullName -match '\\runtime\\') {
            Write-Error "выбран не exe приложения: $($exe.FullName)"
            exit 1
          }
          $productVersion = (Get-Item $exe.FullName).VersionInfo.ProductVersion
          Write-Host "exe=$($exe.FullName) ProductVersion=$productVersion"
          if (-not $productVersion.StartsWith($env:VERSION)) {
            Write-Error "ProductVersion $productVersion не совпадает с $env:VERSION"
            exit 1
          }
          $runtime = Join-Path $exe.Directory.FullName 'runtime\x86_64-pc-windows-msvc'
          $server = Join-Path $runtime 'llama-server.exe'
          if (-not (Test-Path $server)) {
            Write-Error "В установленном приложении нет runtime: $server"
            exit 1
          }
          $model = Get-ChildItem -Path $installDir -Filter '*.gguf' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($model) {
            Write-Error "В установленном приложении оказались веса модели: $($model.FullName)"
            exit 1
          }
          $runtimeVersion = & $server --version 2>&1 | Out-String
          Write-Host $runtimeVersion
          if (($runtimeVersion -notmatch 'build 12182') -or ($runtimeVersion -notmatch 'commit fd27b2034')) {
            Write-Error "llama-server.exe не подтвердил pin b12182/fd27b2034"
            exit 1
          }
          $runtimeBytes = (Get-ChildItem -Path $runtime -File -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host "Bundled runtime: $runtimeBytes bytes"
          # Подписи Authenticode нет по политике проекта: фиксируем статус в логе.
          $signature = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Authenticode: $($signature.Status) $($signature.StatusMessage)"
          python .github/scripts/smoke_http.py `
            --exe $exe.FullName `
            --expected-version $env:VERSION `
            --expected-os windows `
            --expected-arch x86_64 `
            --static-dir ui/web/static `
            --expect-summary-runtime bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  smoke-android:
    needs: [meta, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/download-artifact@v8
        with:
          name: tauri-bundles-android
          path: pkg
      - name: Check APK metadata and signature
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          REQUIRE_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -eu
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          build_tools="$(ls -d "$sdk"/build-tools/* | sort -V | tail -n 1)"
          aapt2="$build_tools/aapt2"
          apksigner="$build_tools/apksigner"
          apk="$(find pkg -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::APK не найден"
            exit 1
          fi
          badging="$("$aapt2" dump badging "$apk")"
          echo "$badging" | head -n 5
          echo "$badging" | grep -q "package: name='io.github.guest363.podtekst'" || {
            echo "::error::Неверный package в APK"; exit 1; }
          echo "$badging" | grep -q "versionName='$VERSION'" || {
            echo "::error::versionName не совпадает с $VERSION"; exit 1; }
          version_code="$(echo "$badging" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
          if ! echo "$version_code" | grep -Eq '^[0-9]+$'; then
            echo "::error::В APK нет versionCode"
            exit 1
          fi
          abis="$(echo "$badging" | sed -n 's/^native-code: //p' | head -n 1)"
          echo "$badging" | grep -q "native-code:.*arm64-v8a" || {
            echo "::error::В APK нет ABI arm64-v8a"; exit 1; }
          if [ -z "$abis" ]; then
            echo "::error::В badging нет native-code"
            exit 1
          fi
          # Android не поддерживает итоги: ни runtime, ни весов модели в APK.
          unzip -l "$apk" > "$RUNNER_TEMP/apk-files.txt"
          if grep -E 'llama-server|libllama|libggml|\.gguf$|assets/runtime/' "$RUNNER_TEMP/apk-files.txt"; then
            echo "::error::В APK попал runtime или модель итогов"; exit 1
          fi
          echo "Android APK: $(stat -c %s "$apk") bytes"
          # Rust вызывает эти методы MainActivity через JNI по имени. R8 в release
          # вырезает их без keep-правила, и запись падает с NoSuchMethodError.
          unzip -p "$apk" 'classes*.dex' | strings | grep -q 'startRecordingService' || {
            echo "::error::R8 удалил JNI-методы MainActivity (проверьте proguard-rules.pro)"; exit 1; }
          # Сертификат в лог не печатаем: только результат проверки схем подписи.
          "$apksigner" verify --print-certs --verbose "$apk" > "$RUNNER_TEMP/apksigner.txt"
          grep -E "Verified using v[0-9]+ scheme .*: true" "$RUNNER_TEMP/apksigner.txt" || {
            echo "::error::apksigner не подтвердил ни одну схему подписи"; exit 1; }
          if [ "$REQUIRE_RELEASE_SIGNING" = "true" ] && grep -q "CN=Android Debug" "$RUNNER_TEMP/apksigner.txt"; then
            echo "::error::APK подписан debug-ключом, а для тега нужен release keystore"
            exit 1
          fi
          signing="release"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/apksigner.txt"; then
            signing="debug"
          fi
          shell_sha="$(sha256sum "$apk" | awk '{print $1}')"
          echo "Android APK: $apk, $(stat -c %s "$apk") bytes, versionCode=$version_code, abis=$abis, signing=$signing, sha256=$shell_sha"
          # Релизное evidence фиксирует фактический APK, а не число из
          # отчёта: размер и SHA-256 зависят от toolchain/подписи.
          APK_PATH="$apk" APK_SHA256="$shell_sha" APK_VERSION="$VERSION" \
          APK_VERSION_CODE="$version_code" APK_ABIS="$abis" APK_SIGNING="$signing" \
          TAG="$TAG" python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          def stop(message):
              print(f"::error::{message}")
              sys.exit(1)

          path = Path(os.environ["APK_PATH"])
          if not path.is_file():
              stop(f"APK отсутствует: {path}")
          size = path.stat().st_size
          if size <= 0:
              stop(f"APK пустой: {path}")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != os.environ["APK_SHA256"]:
              stop(f"SHA-256 APK {digest} != {os.environ['APK_SHA256']}")
          version = os.environ["APK_VERSION"]
          if not version:
              stop("пустой versionName")
          version_code = int(os.environ["APK_VERSION_CODE"])
          if version_code <= 0:
              stop(f"некорректный versionCode: {version_code}")
          abis = [part.strip("'\" ") for part in os.environ["APK_ABIS"].split() if part.strip("'\" ")]
          if "arm64-v8a" not in abis:
              stop(f"в APK нет arm64-v8a: {abis}")
          evidence = {
              "spec": "S-11",
              "generated_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "tag": os.environ.get("TAG"),
              "commit": os.environ.get("GITHUB_SHA"),
              "apk": {
                  "file": path.name,
                  "path": str(path),
                  "size_bytes": size,
                  "sha256": digest,
                  "package": "io.github.guest363.podtekst",
                  "version_name": version,
                  "version_code": version_code,
                  "abis": abis,
                  "build_type": "release",
                  "signing": os.environ["APK_SIGNING"],
              },
          }
          out = Path(os.environ.get("GITHUB_WORKSPACE", ".")) / "apk-evidence.json"
          out.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"→ {out}: {size} bytes, sha256={digest}, versionCode={version_code}")
          PY
      - name: Upload APK evidence
        uses: actions/upload-artifact@v7
        with:
          name: apk-evidence
          if-no-files-found: error
          path: apk-evidence.json

  # Сначала latest.json: иначе SHA256SUMS не покроет манифест.
  manifest:
    needs: [meta, build-tauri, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Install cryptography
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Build latest.json and SHA256SUMS
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          ALLOW_LEGACY_NOTES: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          extra=()
          if [ "$ALLOW_LEGACY_NOTES" = "true" ]; then
            extra+=(--allow-legacy-notes)
          fi
          python .github/scripts/updater_manifest.py \
            --root . \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --artifacts dist \
            "${extra[@]}"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          if-no-files-found: error
          path: dist/*

  publish:
    needs: [meta, manifest, real-summary, smoke-linux, smoke-macos, smoke-windows, smoke-android]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Release notes present
        run: test -s ".github/release-notes/${{ needs.meta.outputs.tag }}.md"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: Подтекст ${{ needs.meta.outputs.tag }}
          tag_name: ${{ needs.meta.outputs.tag }}
          body_path: .github/release-notes/${{ needs.meta.outputs.tag }}.md
          fail_on_unmatched_files: true
          files: |
            dist/**/*

  # Проверка после публикации: свежий latest.json, URL, SHA256SUMS и подписи.
  # Отдельный workflow_dispatch не нужен: GITHUB_TOKEN не создаёт новый запуск
  # по событию release published, поэтому проверяем здесь.
  verify-published:
    needs: [meta, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install cryptography
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Verify published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          python .github/scripts/verify_release.py \
            --root . \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --require-latest
