# Pre-push повторяет гейты CI: ошибки формата и линта ловятся до отправки ветки.
# Команды не дублируются: их правка живёт в verify.sh, здесь — только режимы.
pre-push:
  parallel: true
  commands:
    # Инструкции идут первыми: сборка фронта переписывает .mr-stamp, и p11 принял бы
    # новый штамп за локальную правку.
    instructions:
      run: ./scripts/verify.sh --fast
      priority: 1
    rust:
      run: ./scripts/verify.sh --rust
      priority: 2
    # tauri_shell.rs и код под #[cfg(feature = "tauri-ui")] компилируются
    # только с этой фичей: без отдельного прогона окно падает лишь в CI.
    tauri:
      run: ./scripts/verify.sh --tauri
      priority: 2
    frontend:
      run: ./scripts/verify.sh --ui
      priority: 2
