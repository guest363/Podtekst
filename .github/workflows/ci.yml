name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No personal data, models or runtime binaries in git
        run: |
          bad=$(git ls-files | grep -E '(^|/)(people|external_people|voiceprints|config|media_registry)\.json$|\.(log|apk|onnx|part|gguf|dylib|dll)$|(^|/)llama-server(\.exe)?$|(^|/)lib[^/]*\.so(\.[0-9]+)*$|(^|/)runtime/(x86_64-unknown-linux-gnu|aarch64-apple-darwin|x86_64-pc-windows-msvc)/|llama-b[0-9]+-bin-[^/]*\.(tar\.gz|zip)$' || true)
          if [ -n "$bad" ]; then
            echo "В git попали личные данные, модель или runtime:"
            echo "$bad"
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    needs: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99" # закреплён rust-toolchain.toml; MSRV по lock-файлу — 1.92 (ort)
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Summary API contract (no model, no runtime)
        run: cargo test -p mr-app --test summary_api_contract --locked
      - name: Release build (default features, no system deps)
        run: cargo build --release -p mr-app --locked
      - name: Headless --web smoke (no runtime -> 503, startup OK)
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/mr-app/Cargo.toml | head -n1)"
          python3 ../.github/scripts/smoke_http.py \
            --exe target/release/podtekst \
            --expected-version "$version" \
            --expected-os linux \
            --expected-arch x86_64 \
            --static-dir ../ui/web/static \
            --expect-summary-runtime missing
      - name: Clippy (tauri-ui feature; tauri_shell.rs иначе не компилируется)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          cargo clippy -p mr-app --features tauri-ui --all-targets --locked -- -D warnings

  macos:
    needs: frontend
    runs-on: macos-26
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy (zero warnings)
        run: cargo clippy -p mr-audio -p mr-app --all-targets --locked -- -D warnings

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build frontend (Svelte)
        working-directory: ui/web/frontend
        run: |
          corepack enable
          yarn install --immutable
          yarn lint
          yarn check
          yarn build
      - name: Static build is committed
        run: |
          # yarn build очищает static/ и не создаёт .mr-stamp — его пишет run.sh или pre-push.
          root="$(git rev-parse --show-toplevel)"
          git -C "$root" checkout -- ui/web/static/.mr-stamp
          expected="$(cd "$root" && ./scripts/frontend-stamp.sh)"
          test "$(cat "$root/ui/web/static/.mr-stamp")" = "$expected"
          git -C "$root" diff --exit-code -- ui/web/static

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Android NDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_HOME" ]; then
            echo "Android NDK не найден"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - name: Check Android target
        working-directory: src-tauri
        run: |
          toolchain="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$toolchain:$PATH"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android24-clang"
          cargo check -p mr-app --target aarch64-linux-android --features tauri-ui --locked

  diarization-regression:
    if: ${{ vars.MR_DIAR_BENCH == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, diarization-bench]
    env:
      MR_DIAR_BENCH: '1'
      MR_DIAR_BENCH_ROOT: ${{ vars.MR_DIAR_BENCH_ROOT }}
      MR_DIAR_BENCH_APP: ${{ github.workspace }}/src-tauri/target/release/podtekst
      MR_DIAR_BENCH_BASELINE: ${{ vars.MR_DIAR_BENCH_BASELINE }}
      MR_MODELS_DIR: ${{ vars.MR_DIAR_BENCH_ROOT }}/appdata/models
      PODTEKST_DATA_DIR: ${{ vars.MR_DIAR_BENCH_ROOT }}/appdata
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99'
      - run: cargo build --release -p mr-app --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test -p mr-ml --features onnx --test onnx_real --locked --manifest-path src-tauri/Cargo.toml quiet_nonzero_samples_do_not_take_digital_silence_shortcut
      - run: |
          "$MR_DIAR_BENCH_ROOT/venv/bin/python" tools/diar_eval/synth_meetings.py --self-test
          "$MR_DIAR_BENCH_ROOT/venv/bin/python" tools/diar_eval/test_regression.py
          "$MR_DIAR_BENCH_ROOT/venv/bin/python" tools/diar_eval/test_fleurs_proof.py
          "$MR_DIAR_BENCH_ROOT/venv/bin/python" tools/diar_eval/regression.py --baseline "$MR_DIAR_BENCH_BASELINE"
