name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: No personal data, models or runtime binaries in git
        run: |
          bad=$(git ls-files | grep -E '(^|/)(people|external_people|voiceprints|config|media_registry)\.json$|\.(log|apk|onnx|part|gguf|dylib|dll)$|(^|/)llama-server(\.exe)?$|(^|/)lib[^/]*\.so(\.[0-9]+)*$|(^|/)runtime/(x86_64-unknown-linux-gnu|aarch64-apple-darwin|x86_64-pc-windows-msvc)/|llama-b[0-9]+-bin-[^/]*\.(tar\.gz|zip)$' || true)
          if [ -n "$bad" ]; then
            echo "В git попали личные данные, модель или runtime:"
            echo "$bad"
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # P11 и инструкции: та же точка входа, что в pre-push, — иначе гейты расходятся.
      - name: Instruction gates (P11 and docs)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="HEAD~1"; fi
          MR_P11_REF="$base...HEAD" ./scripts/verify.sh --fast

  components-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compile scripts
        run: python3 -m py_compile scripts/components_lint.py scripts/components_monitor.py .github/scripts/updater_manifest.py
      - name: Self-test release notes gate
        run: python3 .github/scripts/updater_manifest.py --self-test
      - name: Lint models manifest and ffmpeg pins (offline, no network)
        run: python3 scripts/components_lint.py
      # Инвентарь лицензий кладётся в каждый бандл: расхождение с Cargo.lock
      # не должно уезжать пользователю.
      - name: Third-party licenses match Cargo.lock
        run: python3 scripts/gen-third-party-licenses.py --check

  eval-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # jiwer нужен уже self-тестам metrics.py; остальные тяжёлые
      # зависимости (pyannote/scipy/soundfile) в этот job не тянем.
      - name: Install light eval deps
        run: python3 -m pip install --user --break-system-packages --disable-pip-version-check jiwer==4.0.0
      - name: diar_eval self-tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          for m in metrics.py normalize_wer.py report.py transcript_to_rttm.py evaluate.py; do
            python3 "tools/diar_eval/$m" --self-test
          done
      - name: diar_eval unit tests without heavy deps
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest -v test_check test_perf test_report_versions test_run_preservation test_run_suite test_text_metrics
        working-directory: tools/diar_eval

  rust:
    needs: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99" # закреплён rust-toolchain.toml; MSRV по lock-файлу — 1.92 (ort)
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      # Команды не дублируются: CI и pre-push берут их из verify.sh.
      - name: Gates (fmt, clippy, tests)
        working-directory: ${{ github.workspace }}
        run: ./scripts/verify.sh --rust
      - name: Release build (default features, no system deps)
        run: cargo build --release -p mr-app --bin podtekst --locked
      - name: Headless --web smoke (no runtime -> 503, startup OK)
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/mr-app/Cargo.toml | head -n1)"
          python3 ../.github/scripts/smoke_http.py \
            --exe target/release/podtekst \
            --expected-version "$version" \
            --expected-os linux \
            --expected-arch x86_64 \
            --static-dir ../ui/web/static \
            --expect-summary-runtime missing
      - name: Clippy (tauri-ui feature; tauri_shell.rs иначе не компилируется)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          ../scripts/verify.sh --tauri

  macos:
    needs: frontend
    runs-on: macos-26
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy (zero warnings)
        run: cargo clippy -p mr-audio -p mr-app --all-targets --locked -- -D warnings

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install
        working-directory: ui/web/frontend
        run: |
          corepack enable
          yarn install --immutable
      # Статика и штамп обязаны быть в коммите: verify.sh --ui падает при расхождении.
      - name: Gates (lint, check, build, static stamp)
        run: ./scripts/verify.sh --ui

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Android NDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_HOME" ]; then
            echo "Android NDK не найден"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - name: Check Android target
        working-directory: src-tauri
        run: |
          toolchain="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$toolchain:$PATH"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android24-clang"
          cargo check -p mr-app --target aarch64-linux-android --features tauri-ui --locked
